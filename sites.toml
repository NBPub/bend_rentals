# --------------------------------------------------------------------------
# Buildium
# --------------------------------------------------------------------------

[sites.hummingbird]
label        = "Hummingbird"
company      = "Hummingbird Property Management"
index_url    = "https://hummingbirdpropertymanagement.managebuilding.com/Resident/public/rentals"
structure    = "buildium_rentals"
title_format = "structured"
status       = "ready"
notes        = "Index cards carry no link to their own detail page, so the parser collects detail URLs and parses those - they also carry a pet policy the index omits. No source-side filters. No robots.txt (404)."

# --------------------------------------------------------------------------
# WordPress, server-rendered detail pages
# --------------------------------------------------------------------------

[sites.preferred_residential]
label        = "Preferred Residential"
company      = "Preferred Residential"
index_url    = "https://prbend.com/bend-long-term-rentals/"
structure    = "prbend_property_pages"
title_format = "structured"
status       = "ready"
notes        = "The only source that states a property type. Publishes NO street address - the one on each page is the agency office from the footer map - so the address and coordinates come from resolving its 'View This Rental on a Map' short link instead."

# --------------------------------------------------------------------------
# Rentvine
# --------------------------------------------------------------------------

[sites.ridgeline]
label        = "Ridgeline"
company      = "Ridgeline Property Management"
index_url    = "https://ridgelinepropertymgmt.rentvine.com/api/public/listings"
structure    = "rentvine_listings"
title_format = "structured"
status       = "ready"
notes        = "The vacancies page is a JS widget; this is the endpoint that widget itself reads. The richest source here: explicit acceptCats/acceptDogs booleans and real coordinates, so it needs no geocoding. Rentvine publishes no robots.txt (403 on both hosts). No source-side filters."
